# Pultwerk01 hardware configuration template. The Pi keeps its own copy in ~/desk-display/config.toml,
# which updates never replace; any key missing there falls back to this file.
# Changes need:  sudo systemctl restart desk-display@$USER
# Everything you change day to day (screens, order, brightness, gauge, sound, tickers)
# lives in settings.json and is edited from the web page:  http://<pi>:8080

[location]
name = "Riyadh"
lat = 24.7136          # put your own coordinates here (radar, weather, prayer, sun, moon)
lon = 46.6753
timezone = "Asia/Riyadh"

[photos]
folder = "~/desk-display/photos"   # the web page uploads here; any JPG/PNG/WebP, subfolders included
shuffle = true

[prayer]
method = 4                         # 4 = Umm al-Qura (Makkah), the official Saudi calendar

[radar]
radius_nm = 20                     # until a range is picked on the web page (Radar)
poll_seconds = 3
timeout_minutes = 0                # 0 = stay on until Button B is pressed again

[web]
enabled = true
port = 8080
bind = "0.0.0.0"                   # reachable from your phone on the same Wi-Fi
password = ""                      # set one to make the page ask for it (any user name)

[wifi]
setup_hotspot = true               # no network to join: open a hotspot and show a QR code to set up from a phone
hotspot_name = "Pultwerk-Setup"
wait_new_seconds = 5               # no saved network: how long to wait before opening the hotspot
wait_saved_seconds = 180           # saved network not reachable: it may just be restarting
retry_saved_seconds = 300          # while the hotspot is up and unused, how often to try saved networks again

[display]
rotation = 0
# pins (BCM). 18/19/21 are the I2S amp, so the backlight moved to GPIO 12 (hardware PWM0).
dc = 25
rst = 24
bl = 12
speed_hz = 40000000

[buttons]
cycle = 22                         # Button A: short = next slide, long = sleep/wake, in radar = exit radar
radar = 23                         # Button B: toggle radar
long_press_seconds = 1.5
both_seconds = 3                   # hold A and B together this long for a retro animation

[gauge]
enabled = true
servo_pin = 13                     # SG90 signal (orange). Red -> 5 V, brown -> GND, 1000 uF across them
min_angle = 70                     # servo angle at the dial's zero  (tune on the printed dial)
max_angle = -70                    # servo angle at full scale; may be lower than min_angle
park_angle = 70                    # where the needle rests for the "off" metric and at night
settle_seconds = 0.6               # servo is powered only while moving, then released (no hum, no jitter)
backlight_pin = 27                 # dial light: white LED, GPIO27 -> 68 ohm -> LED -> GND (about 5-10 mA); -1 = none

[sound]
enabled = true
device = "plughw:CARD=MAX98357A,DEV=0"   # the I2S amp; check the name with: aplay -l
sample_rate = 22050
keep_open = true                   # one aplay stays open and plays silence between sounds, so the amp never pops
